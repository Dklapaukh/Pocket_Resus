notes:
  numbers: "===== PART 1: CLINICAL NUMBERS AND RULES ====="
  numbers.timing.cprCycleMs: "2-minute CPR cycle (EAS 3.14)"
  numbers.timing.adrenalineIntervalMs: adrenaline review every 4 minutes (EAS 3.14)
  numbers.timing.checklistPromptMinLeftMs: offer the checklist only while at least 1 min 30 s of the cycle remains
  numbers.weight.maxKg: highest weight accepted as valid
  numbers.weight.adultAboveKg: "above 40 kg the patient is treated as an adult (\"41 kg = 50 kg\")"
  numbers.weight.adultRoundedToKg: "how the wording describes an adult weight (\"rounded to 50 kg or more\")"
  numbers.ageEstimate: Paediatric weight estimate from age, in years, from the EAS 7.2 band table headings (cpg-paediatric-equipment.pdf pages 5-15; change A16, owner-approved 14 Nov 2026). An age of 1 year or more is ROUNDED UP to the next whole year first. Ages of 0 or less, or above adultUpToAge, give no estimate.
  numbers.ageEstimate.underOneYearKg: any age below 1 year
  numbers.ageEstimate.bands: "Rounded-up age up to maxAge (and above the previous row) gives weightKg, the band weight: 1 year 10 kg, 2-5 years 20 kg, 6-10 years 30 kg, 11-13 years 40 kg"
  numbers.ageEstimate.adultUpToAge: "a rounded-up age above the last band and up to this age is treated as adult (owner decision 8: age 14 = adult): no weight is filled and the weight must be entered"
  numbers.childBands: "Child weight bands (EAS 7.2). A child's weight is ROUNDED UP to the next band (e.g. 15 kg uses the 20 kg row). magnesiumMmol null = no dose listed: seek clinical advice. shockJ = 4 J/kg of the band, from change A1 (owner-approved 3 Nov 2026). fluidsTableMl = the 0.9% sodium chloride 20 mL/kg volume from the EAS 7.2 band table (change A11, owner-approved 14 Nov 2026). ettSizesMm and ettLengthCm = the cuffed ETT size(s) and length at lips from the EAS 7.2 band table (change A18, owner-approved 14 Nov 2026), shown in the Tube sizes pop-up."
  numbers.adult: Adult references (also used when no weight has been entered).
  numbers.child.fluidsMinMlPerKg: "20-40 mL/kg, EAS 3.14. A child uses the weight band (change A11): the lower volume is the band's fluidsTableMl, the upper is fluidsMaxMlPerKg x the band weight"
  numbers.shock.joulesPerKg: each child band's shockJ = maxKg x joulesPerKg (change A1; checked by test)
  numbers.shock.paediatricPadsUpToJ: prompt for paediatric pads when the energy reference is 100 J or less
  numbers.shock.maxRecordableJ: a recorded energy must be above 0 and no more than this
  numbers.rhythms: Rhythms that can be recorded for each rhythm-check outcome.
  numbers.lowerCard: "Which card fills the lower drug slot on the Live screen (A2c 3 Nov 2026, A7 11 Nov 2026). The latest rhythm (from either list) decides: a fluids rhythm shows the fluids card; an amiodarone rhythm shows amiodarone, or magnesium if torsades was ever recorded. Rhythms in neither list (\"Unknown\") are ignored, and so is any rhythm recorded with ROSC (A8, 12 Nov 2026: ROSC \"Other\" is not a non-shockable arrest rhythm)."
  numbers.amiodarone: "Amiodarone doses become due at these shock counts (earlier shocks count): first dose at 3, second at 6 (A2, A2b, C6b-2). The number of entries is the maximum number of doses."
  numbers.magnesium: "Magnesium for torsades: one dose and a single repeat at most (EAS 3.14)."
  numbers.products: Products named in the wording and the record forms.
  numbers.products.fluid: also the diluent
  numbers.preparation: Preparation shown in the Administration pop-ups (EAS 14.3 adrenaline, EAS 14.27 / 7.2 magnesium).
  numbers.preparation.adrenalineChild: "children 40 kg or less: 1 mg to 10 mL (0.1 mg/mL)"
  numbers.preparation.magnesium.adultGrams: the adult 10 mmol dose in grams
  numbers.preparation.magnesium.overMinMinutes: given over 1-2 minutes
  numbers.preparation.magnesium.ampouleMmol: "paediatric: 10 mmol / 5 mL ampoule diluted to 10 mL = 1 mmol/mL"
  numbers.rsi: "RSI dose references (EAS 9.3), shown on the Guidance tab. Change A12 (owner-approved 14 Nov 2026): the doses are looked up in the EAS 9.3 dose summary tables (tables.paediatric and tables.adult, cpg-rsi.pdf page 2), not calculated. A child (weight.adultAboveKg or less) uses the column of its weight band, rounded up; the 5 kg band has no column, so the pop-up shows \"Seek clinical advice\" (decision 7 rule 3). An adult uses the first adult column at or above the weight (rounded up to the next 10 kg); above the last column the last (\"≥ 100 kg\") is used. The per-kg doses, maximums and roundAdultToMg fill the Guidance-tab RSI extract wording only."
  numbers.rsi.blocker: rocuronium OR suxamethonium
  numbers.doubleTapLockMs: "A5 (owner ruling 4 Nov 2026): after a dose is recorded, the Live card cannot record again for this long. Adrenaline is also greyed out while locked; magnesium and fluids are not."
  numbers.doubleTapLockMs.adrenaline: "3 min 30 s"
  wording: "===== PART 2: CLINICAL WORDING =====\n\nReference wording shown with the doses. {name} is filled in by the app, e.g. {band} = 20."
  wording.childSecondAmiodarone: "C6b: no EAS source for a child second dose"
  wording.headerEnergyTitle: "Below: wording whose {gaps} are filled automatically from part 1 (engine wordingGaps). A list is shown as separate paragraphs. Only <b>, <em> and <br> are used inside the wording.\n\nHeader and weight pop-up"
  wording.adrenalineOverdue: Live drug cards
  wording.noWeightDoseReference: Adrenaline and amiodarone Administration pop-ups
  wording.amiodaroneAfterTorsadesWarning: Record forms
  wording.torsadesExtractTitle: Torsades and fluids guideline extracts, and their Administration pop-ups
  wording.guidanceIntro: Guidance & sources pop-up
  wording.rsiNotRecorded: RSI and tube pop-ups (Guidance tab)
  wording.tubeSizeBand: "Tube sheet results (change A18): sizes and length come from the band row (numbers.childBands, ettSizesMm and ettLengthCm); two sizes are joined by tubeSizeOr"
  wording.weightSheetAgeEstimate: Age-estimate captions (weight sheet, tube sheet); gaps come from numbers.ageEstimate
  checklists: "===== PART 3: CHECKLISTS AND REVERSIBLE CAUSES ====="
  checklists.lists: The four checklists (Guidance tab and Post ROSC). Each item is ticked and timestamped in the log.
  checklists.causes: "4 Hs and 4 Ts: names and short guidance prompts (shown from the Guidance tab)."
  equipment: "===== PART 4: EQUIPMENT ====="
  equipment.devices: Airway and access device types and their size choices (record forms).
  equipment.blades: Laryngoscope blade choices, by method.
  equipment.maxTubeSizeMm: a recorded intubation tube size must be above 0 and no more than this
  equipment.sites: IV / IO access site choices.
  equipment.colours: Colours shown beside cannula, IO and iGel sizes.
  equipment.igelRanges: iGel weight ranges in kg (Intersurgical product information); maxKg null = and above.
  sources: "===== PART 5: SOURCES ====="
  sources.exportDate: date of the packaged guideline PDFs
  sources.guidelines: "Guidelines the app links to: EAS code, label, PDF packaged with the app (offline) and web page."
  sources.guidelines.cardiacArrest.offlinePage: the flowchart page
  sources.guidanceLinks: Links listed in the Guidance & sources pop-up, in this order.
  numbers.timing.overdueShownAfterMs: "The Live screen adds how late the rhythm check is (for example \"Rhythm check due · +00:05\") only once it is more than this late: 1 second."
  numbers.timing.prepareAtMs: "From this long before the end of a CPR cycle the screen says \"Prepare for rhythm check\" and the timer panel turns yellow: 15 seconds."
  numbers.timing.warningAtMs: "From this long before the end of a CPR cycle the screen says \"30 seconds remaining\" (the number in that message is filled from this value): 30 seconds."
  numbers.timing.adrenalineHighlightMs: "The adrenaline card is highlighted from this long before the adrenaline review is due, and while it is overdue: 30 seconds."
  numbers.resusStart: "The \"When did resus start?\" pop-up."
  numbers.resusStart.quickChoicesMin: "Quick choices on that pop-up: minutes before the app was opened, in the order shown."
  numbers.correctionRhythms: "Rhythms offered on the \"Correct event\" form, for each kind of event, in the order shown on the form. This order differs on purpose from the recording lists in numbers.rhythms. \"rhythm\" is for a stand-alone rhythm entry."
  numbers.log: The event log.
  numbers.log.interventionEventTypes: "Event kinds shown under \"Interventions only\" in the log. Checklist ticks are not included. A cause marked as treated is also shown (that rule is in the program)."
  numbers.medicineForm: "Choices on the \"Record medicine\" form (units and routes), in the order shown."
  equipment.accessDevices: Devices listed under Access. Every other device is listed under Airway; with no group chosen all devices are listed.
  equipment.forms: "The questions and answer choices on the equipment forms, in the order shown. The words used as field names in the log (for example \"method: Video\") are the program's own and are not set here."
  equipment.forms.laryngoscopy.methods: Must match the two blade lists in equipment.blades (first = Video list, second = Direct list).
  equipment.forms.intubation.lipsMinCm: "Length at lips: the smallest value the box accepts, in cm."
  equipment.forms.intubation.lipsMaxCm: "Length at lips: the largest value the box accepts, in cm."
  wording.estimatedWeightSource: "Must start with the word \"Estimated\": the weight button shows \"· est.\" beside the shock energy for any weight source that starts with it."
  wording.drugNames: "Medicine names shown on the Live cards, in pop-up titles and written into the log. Changing a name here does not change which typed names count as that medicine: the program matches adrenaline, amiodarone, magnesium and the fluid name (numbers.products.fluid)."
  wording.weightSources: Text saved with the weight when it is typed in. An age estimate saves its own sentence (estimatedWeightSource).
  wording.rhythmCheckTitles: Log titles for the three rhythm-check outcomes.
  wording.eventDetails: Text saved in the log (second line of an entry). New entries only; entries already saved keep their old text.
  wording.eventTitles: Log titles for recorded events. New entries only; entries already saved keep their old text.
  wording.checklistSummary: "Log rows for \"Start & finish only\": the words \"started\" and \"finished\" are part of the row title."
  wording.shockRhythmButtons: Rhythm buttons after a shock, in the order shown. The key is the rhythm name saved in the log.
  wording.otherRhythmButtons: Rhythm buttons after no shock or ROSC show the rhythm name itself, except the names listed here.
  wording.references: "How a guideline reference is written. \"{issuer}\" is EAS or ANZCOR."
  wording.weightHeader: The weight button at the top of every screen and the shock energy under it.
  wording.liveCards: Status lines, button labels and values on the Live medicine cards.
  wording.liveScreen: The timer, cycle captions and buttons on the Live screen.
  wording.liveScreen.captionWarning: "{warningSeconds} is filled from numbers.timing.warningAtMs."
  wording.cycleLog: "The \"Cycle log\" pop-up."
  wording.checks: Words around a checklist (the checklist items themselves are in part 3).
  wording.log: The Log tab.
  wording.guidance: "The Guidance tab and the \"Guidance & sources\" pop-up title."
  wording.referenceSheets: The RSI dose and tube size pop-ups (the sentences in them are above).
  wording.popups: Words shared by every pop-up.
  wording.forms: Words shared by the record forms.
