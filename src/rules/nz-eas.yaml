about: "CLINICAL RULES FILE: NZ EAS clinical practice guidelines (packaged exports 24 September 2026).\n\nEvery clinical number and rule the app uses lives here (engine numbers since 11 Nov 2026; the drug-card rules, A5 locks and reference wording since 12 Nov 2026), so they can be checked against the guideline in one place. This file is plain data (no program logic), so a future rules editor can read and write it, and other services can have their own copy.\n\nFive parts (owner decision 2, doc 18), each with its own checks: 1 numbers clinical numbers and rules 2 wording clinical wording; numbers appear only as {gaps} filled from part 1 3 checklists checklists and reversible causes 4 equipment device types, sizes, access sites, colours 5 sources guideline name, export date, PDF files and web links\n\nDo not change a value without the owner's approval (see docs/07, A-table). tests/rules-file.test.mjs checks every value below against the guideline tables."
